<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card shadow">

        <div class="card-body">

          <h3 class="text-center mb-4">
            Create Account
          </h3>

          @if (message) {

            <div class="alert alert-success">
              {{ message }}
            </div>

          }

          @if (errorMessage) {

            <div class="alert alert-danger">
              {{ errorMessage }}
            </div>

          }

          <form
            [formGroup]="registerForm"
            (ngSubmit)="register()"
          >

            <div class="mb-3">

              <label class="form-label">
                Name
              </label>

              <input
                class="form-control"
                formControlName="name"
              >

            </div>

            <div class="mb-3">

              <label class="form-label">
                Email
              </label>

              <input
                type="email"
                class="form-control"
                formControlName="email"
              >

            </div>

            <div class="mb-3">

              <label class="form-label">
                Password
              </label>

              <input
                type="password"
                class="form-control"
                formControlName="password"
              >

            </div>

            <button
              class="btn btn-success w-100"
              type="submit"
            >
              Register
            </button>

          </form>

          <div class="text-center mt-3">

            Already have an account?

            <a routerLink="/login">
              Login
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
