<div class="container mt-4">

  <div class="card shadow">

    <div class="card-header">

      <h4>
        Employee Information
      </h4>

    </div>

    <div class="card-body">

      <form
        [formGroup]="employeeForm"
        (ngSubmit)="saveEmployee()"
      >

        <div class="row">

          <!-- Employee ID -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Employee ID
            </label>

            <input
              class="form-control"
              formControlName="employeeId"
            >

          </div>


          <!-- First Name -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              First Name
            </label>

            <input
              class="form-control"
              formControlName="firstName"
            >

          </div>


          <!-- Last Name -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Last Name
            </label>

            <input
              class="form-control"
              formControlName="lastName"
            >

          </div>


          <!-- Email -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Email
            </label>

            <input
              type="email"
              class="form-control"
              formControlName="email"
            >

          </div>


          <!-- Phone -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Phone
            </label>

            <input
              class="form-control"
              formControlName="phone"
            >

          </div>


          <!-- Gender -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Gender
            </label>

            <select
              class="form-select"
              formControlName="gender"
            >

              <option value="">
                Select Gender
              </option>

              <option value="Male">
                Male
              </option>

              <option value="Female">
                Female
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>


          <!-- DOB -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Date of Birth
            </label>

            <input
              type="date"
              class="form-control"
              formControlName="dateOfBirth"
            >

          </div>


          <!-- Address -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Address
            </label>

            <input
              class="form-control"
              formControlName="address"
            >

          </div>


          <!-- Department -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Department
            </label>

            <select
              class="form-select"
              formControlName="department"
            >

              <option value="">
                Select Department
              </option>

              @for (
                department of departments;
                track department._id
              ) {

                <option
                  [value]="department._id"
                >
                  {{ department.name }}
                </option>

              }

            </select>

          </div>


          <!-- Designation -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Designation
            </label>

            <select
              class="form-select"
              formControlName="designation"
            >

              <option value="">
                Select Designation
              </option>

              @for (
                designation of designations;
                track designation._id
              ) {

                <option
                  [value]="designation._id"
                >
                  {{ designation.name }}
                </option>

              }

            </select>

          </div>


          <!-- Salary -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Salary
            </label>

            <input
              type="number"
              class="form-control"
              formControlName="salary"
            >

          </div>


          <!-- Joining Date -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Joining Date
            </label>

            <input
              type="date"
              class="form-control"
              formControlName="joiningDate"
            >

          </div>


          <!-- Employment Type -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Employment Type
            </label>

            <select
              class="form-select"
              formControlName="employmentType"
            >

              <option value="Full Time">
                Full Time
              </option>

              <option value="Part Time">
                Part Time
              </option>

              <option value="Contract">
                Contract
              </option>

              <option value="Intern">
                Intern
              </option>

            </select>

          </div>


          <!-- Status -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Status
            </label>

            <select
              class="form-select"
              formControlName="status"
            >

              <option value="Active">
                Active
              </option>

              <option value="Inactive">
                Inactive
              </option>

            </select>

          </div>

        </div>


        <button
          type="submit"
          class="btn btn-primary me-2"
        >
          Save Employee
        </button>

        <button
          type="button"
          class="btn btn-secondary"
          routerLink="/employees"
        >
          Cancel
        </button>

      </form>

    </div>

  </div>

</div>
