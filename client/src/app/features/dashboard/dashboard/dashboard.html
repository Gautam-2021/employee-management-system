<div class="container mt-4">

  <h2 class="mb-4">Employee Dashboard</h2>

  <div class="row g-4">

    <!-- Total -->
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5>Total Employees</h5>
          <h2>{{ totalEmployees }}</h2>
        </div>
      </div>
    </div>

    <!-- Active -->
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5>Active Employees</h5>
          <h2>{{ activeEmployees }}</h2>
        </div>
      </div>
    </div>

    <!-- Inactive -->
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5>Inactive Employees</h5>
          <h2>{{ inactiveEmployees }}</h2>
        </div>
      </div>
    </div>

  </div>

</div>
