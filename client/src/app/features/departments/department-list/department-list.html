<div class="container mt-4">

  <div
    class="d-flex justify-content-between mb-3"
  >

    <h2>
      Departments
    </h2>

    <a
      routerLink="/departments/add"
      class="btn btn-primary"
    >
      Add Department
    </a>

  </div>

  <table class="table table-bordered">

    <thead class="table-dark">

      <tr>

        <th>Name</th>
        <th>Description</th>
        <th>Status</th>
        <th>Actions</th>

      </tr>

    </thead>

    <tbody>

      @for (
        department of departments;
        track department._id
      ) {

        <tr>

          <td>
            {{ department.name }}
          </td>

          <td>
            {{ department.description }}
          </td>

          <td>
            {{ department.status }}
          </td>

          <td>

            <a
              [routerLink]="[
                '/departments/edit',
                department._id
              ]"
              class="btn btn-warning btn-sm me-2"
            >
              Edit
            </a>

            <button
              class="btn btn-danger btn-sm"
              (click)="
                deleteDepartment(
                  department._id
                )
              "
            >
              Delete
            </button>

          </td>

        </tr>

      }

    </tbody>

  </table>

</div>
